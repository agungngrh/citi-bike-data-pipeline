citibike:
  target: dev

  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'jcdeah-009') }}"
      dataset: citibike_staging
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/opt/airflow/secrets/gcp-key.json') }}"
      threads: 2
      timeout_seconds: 300
      priority: interactive
      location: asia-southeast2